name: Windows ARM64
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - labeled
  workflow_dispatch: null
concurrency:
  group: windows-arm64-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows-arm64:
    uses: storytold/craft-common-actions/.github/workflows/windows-arm64.yml@fa5ef18780cf5e7d5d3b8de068de56cffc83cac5
    with:
      app-name: cadcraft
      app-dir: CADCraft
      install-relative-path: Programs/ArtCraft/CADCraft
      install-scope: perUser
