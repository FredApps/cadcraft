name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The workspace has about 224 integration-test binaries, and each links the whole app. With full
  # debug info the debug target directory passes 90 GB, far past a runner's disk.
  CARGO_PROFILE_DEV_DEBUG: 0

# A newer push to a PR branch cancels its older run. Runs on main are never cancelled, so every
# state of main that gets a run is checked to the end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: cargo xtask ci
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Unused toolchains in the image are deleted in the background: the space is free before the
      # build needs it, and nothing waits.
      - name: Install Linux system dependencies (egui/winit/rfd)
        run: |
          nohup sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL </dev/null >/dev/null 2>&1 &
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      # Only main saves caches; PRs restore main's, so PR runs don't evict it from the cache budget.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      # fmt --check, clippy -D warnings, test, assets, layers and wasm: the gate CLAUDE.md and
      # AGENTS.md ask for before every commit.
      - name: cargo xtask ci
        run: cargo xtask ci

      - name: Disk after the build
        if: always()
        run: |
          df -h /
          du -sh target 2>/dev/null || true
