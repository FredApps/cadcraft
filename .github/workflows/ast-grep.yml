name: ast-grep
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - labeled
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ast-grep-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    uses: storytold/craft-common-actions/.github/workflows/ast-grep.yml@41e0b4e0977a2c72a3b8847f52d097583109098e
    with:
      config: lint/ast-grep/sgconfig.yml
      paths: apps/cadcraft-cli/src apps/cadcraft/src/launch_args.rs apps/cadcraft/src/main.rs
