name: ast-grep
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - labeled
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ast-grep-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    uses: storytold/craft-common-actions/.github/workflows/ast-grep.yml@8bb4e5ab95443171104ad88113fe1ef9b0e5ce3f
    with:
      config: lint/ast-grep/sgconfig.yml
      paths: apps/cadcraft-cli/src apps/cadcraft/src/launch_args.rs apps/cadcraft/src/main.rs
